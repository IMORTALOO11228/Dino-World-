<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="انتخاب جانوران ماقبل تاریخ در موزه تعاملی DinoWorld"
    >

    <title>DinoWorld | انتخاب جانور</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <header class="hero">
        <h1>🦖 انتخاب جانور</h1>

        <p>
            یک جانور را انتخاب کن تا اطلاعات کامل آن را ببینی.
        </p>
    </header>


    <main class="periods">

        <h2>🦴 جانوران موزه</h2>


        <div
            style="
                max-width:700px;
                margin:0 auto 30px;
                padding:15px 20px;
                border-radius:15px;
                background:#1e293b;
                border:1px solid #334155;
                text-align:center;
                color:#cbd5e1;
            "
        >
            ℹ️ اگر اطلاعات نمایش داده نمی‌شود، صفحه را رفرش کنید.
        </div>


        <!-- فهرست حیوانات هر دوره -->
        <div
            id="animal-list"
            class="period-grid"
        >
            <p>در حال بارگذاری...</p>
        </div>


        <!-- بازگشت به صفحه اصلی -->
        <div
            style="
                text-align:center;
                margin-top:40px;
            "
        >
            <a
                href="../index.html"
                class="period-card"
                style="
                    display:inline-block;
                    width:auto;
                "
            >
                🏠 بازگشت به صفحه اصلی
            </a>
        </div>

    </main>


    <footer>
        🟢 DinoWorld | طراحی شده توسط آریا عابدینی 💚
    </footer>


    <script src="../script.js/script.js"></script>

</body>

</html>
