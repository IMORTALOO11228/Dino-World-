<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="اطلاعات کامل جانوران ماقبل تاریخ در موزه تعاملی DinoWorld"
    >

    <title>DinoWorld | اطلاعات جانور</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">

        <h1 id="animal-name">
            🦖 در حال بارگذاری...
        </h1>

        <p>
            موزه تعاملی دنیای ماقبل تاریخ
        </p>

    </header>


    <main class="periods">

        <!-- پیام راهنما -->
        <div
            style="
                max-width:700px;
                margin:0 auto 30px;
                padding:15px 20px;
                border-radius:15px;
                background:#1e293b;
                border:1px solid #334155;
                text-align:center;
                color:#cbd5e1;
            "
        >
            ℹ️ اگر اطلاعات نمایش داده نمی‌شود، صفحه را رفرش کنید.
        </div>


        <!-- اطلاعات جانور -->
        <section
            id="animal-details"
            class="about"
            style="
                max-width:900px;
                margin:0 auto;
                text-align:right;
            "
        >

            <p style="text-align:center;">
                در حال بارگذاری اطلاعات جانور...
            </p>

        </section>


        <!-- دکمه بازگشت -->
        <div
            style="
                text-align:center;
                margin-top:40px;
            "
        >

            <a
                id="back-to-animals"
                href="animals.html/animals.html"
                class="period-card"
                style="
                    display:inline-block;
                    width:auto;
                "
            >
                ← بازگشت به فهرست جانوران
            </a>

        </div>


        <!-- دکمه صفحه اصلی -->
        <div
            style="
                text-align:center;
                margin-top:20px;
            "
        >

            <a
                href="index.html"
                class="period-card"
                style="
                    display:inline-block;
                    width:auto;
                "
            >
                🏠 بازگشت به صفحه اصلی
            </a>

        </div>

    </main>


    <footer>
        🟢 DinoWorld | طراحی شده توسط آریا عابدینی 💚
    </footer>


    <!-- دیتابیس 66 جانور -->
    <script src="script.js/script.js"></script>


    <!-- سیستم نمایش اطلاعات -->
    <script>

        document.addEventListener("DOMContentLoaded", function () {

            const nameElement =
                document.getElementById("animal-name");

            const detailsElement =
                document.getElementById("animal-details");

            const backLink =
                document.getElementById("back-to-animals");


            const params =
                new URLSearchParams(
                    window.location.search
                );


            const selectedName =
                params.get("name");


            const selectedPeriod =
                params.get("period");


            /*
             * بررسی می‌کنیم که دیتابیس
             * script.js واقعاً بارگذاری شده باشد.
             */

            if (
                !window.dinoWorldAnimals ||
                !Array.isArray(window.dinoWorldAnimals)
            ) {

                nameElement.textContent =
                    "⚠️ خطا در بارگذاری اطلاعات";


                detailsElement.innerHTML = `

                    <div
                        style="
                            padding:25px;
                            border-radius:20px;
                            background:#1e293b;
                            border:1px solid #334155;
                            text-align:center;
                        "
                    >

                        <h2>
                            اطلاعات جانور بارگذاری نشد
                        </h2>

                        <p>
                            فایل اطلاعات جانوران پیدا نشد.
                        </p>

                        <p>
                            صفحه را یک بار رفرش کنید.
                        </p>

                    </div>

                `;

                return;
            }


            /*
             * پیدا کردن جانور انتخاب‌شده
             */

            const animal =
                window.dinoWorldAnimals.find(
                    function (item) {
                        return item.name === selectedName;
                    }
                );


            /*
             * اگر جانور پیدا نشد
             */

            if (!animal) {

                nameElement.textContent =
                    "❌ جانور پیدا نشد";


                detailsElement.innerHTML = `

                    <div
                        style="
                            padding:25px;
                            border-radius:20px;
                            background:#1e293b;
                            border:1px solid #334155;
                            text-align:center;
                        "
                    >

                        <h2>
                            اطلاعاتی پیدا نشد
                        </h2>

                        <p>
                            جانور موردنظر در پایگاه داده
                            موزه وجود ندارد.
                        </p>

                        <p>
                            لطفاً از فهرست جانوران
                            یک مورد را انتخاب کنید.
                        </p>

                    </div>

                `;

                return;
            }


            /*
             * عنوان صفحه
             */

            nameElement.textContent =
                animal.icon +
                " " +
                animal.name;


            /*
             * نمایش اطلاعات کامل
             */

            detailsElement.innerHTML = `

                <div
                    style="
                        text-align:center;
                    "
                >

                    <img
                        src="${animal.image}"
                        alt="تصویر ${animal.name}"
                        style="
                            display:block;
                            width:100%;
                            max-width:700px;
                            height:auto;
                            margin:0 auto 30px;
                            border-radius:20px;
                            border:1px solid #334155;
                        "
                    >

                </div>


                <h2
                    style="
                        text-align:center;
                        margin-bottom:25px;
                    "
                >
                    ${animal.icon}
                    ${animal.name}
                </h2>


                <div
                    style="
                        display:grid;
                        gap:15px;
                    "
                >

                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        🕰️
                        <strong>
                            دوره زمین‌شناسی:
                        </strong>

                        ${animal.period}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        🍖
                        <strong>
                            غذا:
                        </strong>

                        ${animal.food}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        🌍
                        <strong>
                            محل زندگی:
                        </strong>

                        ${animal.habitat}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        📏
                        <strong>
                            اندازه:
                        </strong>

                        ${animal.size}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        🧍
                        <strong>
                            مقایسه با انسان:
                        </strong>

                        ${animal.human}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        ⏳
                        <strong>
                            طول عمر:
                        </strong>

                        ${animal.lifespan}

                    </div>


                    <div
                        style="
                            padding:18px;
                            border-radius:15px;
                            background:#1e293b;
                            border:1px solid #334155;
                        "
                    >

                        ⚔️
                        <strong>
                            دشمنان:
                        </strong>

                        ${animal.enemies}

                    </div>

                </div>


                <div
                    style="
                        margin-top:30px;
                        padding:25px;
                        border-radius:20px;
                        background:#1e293b;
                        border:1px solid #334155;
                    "
                >

                    <h3
                        style="
                            margin-bottom:10px;
                        "
                    >
                        💡 نکته جالب
                    </h3>

                    <p>
                        ${animal.fact}
                    </p>

                </div>

            `;


            /*
             * دکمه بازگشت را به همان دوره‌ای
             * وصل می‌کنیم که جانور از آن انتخاب شده.
             */

            const returnPeriod =
                selectedPeriod || animal.period;


            if (returnPeriod) {

                backLink.href =
                    "animals.html/animals.html?period=" +
                    encodeURIComponent(
                        returnPeriod
                    );

            }

        });

    </script>

</body>

</html>
