<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="اطلاعات کامل جانوران ماقبل تاریخ در موزه تعاملی DinoWorld">
    <title>DinoWorld | اطلاعات جانور</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1 id="animal-name">🦖 در حال بارگذاری...</h1>
        <p>موزه تعاملی دنیای ماقبل تاریخ</p>
    </header>

    <main class="periods">

        <div style="
            max-width:700px;
            margin:0 auto 30px;
            padding:15px 20px;
            border-radius:15px;
            background:#1e293b;
            border:1px solid #334155;
            text-align:center;
            color:#cbd5e1;
        ">
            ℹ️ اگر اطلاعات نمایش داده نمی‌شود، صفحه را رفرش کنید.
        </div>

        <section
            id="animal-details"
            class="about"
            style="max-width:900px;margin:0 auto;text-align:right;"
        >
            <p style="text-align:center;">
                در حال بارگذاری اطلاعات جانور...
            </p>
        </section>

        <!-- فقط دکمه بازگشت مخصوص همان حیوان -->
        <div style="
            text-align:center;
            margin-top:40px;
        ">
            <a
                id="back-to-animals"
                href="animals.html/animals.html"
                class="period-card"
                style="
                    display:inline-block;
                    width:auto;
                "
            >
                ← بازگشت به موزه
            </a>
        </div>

    </main>

    <footer>
        🟢 DinoWorld | طراحی شده توسط آریا عابدینی 💚
    </footer>

    <script src="script.js/script.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const params =
                new URLSearchParams(window.location.search);

            const selectedName =
                params.get("name");

            const selectedPeriod =
                params.get("period");

            const nameElement =
                document.getElementById("animal-name");

            const detailsElement =
                document.getElementById("animal-details");

            const backLink =
                document.getElementById("back-to-animals");

            const animal =
                window.dinoWorldAnimals
                    ? window.dinoWorldAnimals.find(
                        item => item.name === selectedName
                    )
                    : null;

            if (!animal) {

                nameElement.textContent =
                    "❌ جانور پیدا نشد";

                detailsElement.innerHTML = `
                    <div style="
                        padding:25px;
                        border-radius:20px;
                        background:#1e293b;
                        border:1px solid #334155;
                        text-align:center;
                    ">
                        <h2>اطلاعاتی پیدا نشد</h2>
                        <p>
                            اطلاعات این جانور در موزه وجود ندارد.
                        </p>
                    </div>
                `;

                return;
            }

            document.title =
                "DinoWorld | " + animal.name;

            nameElement.textContent =
                animal.icon + " " + animal.name;

            detailsElement.innerHTML = `

                <img
                    src="${animal.image}"
                    alt="تصویر ${animal.name}"
                    style="
                        display:block;
                        width:100%;
                        max-width:700px;
                        height:auto;
                        margin:0 auto 30px;
                        border-radius:20px;
                        border:1px solid #334155;
                    "
                >

                <h2 style="text-align:center;">
                    ${animal.icon} ${animal.name}
                </h2>

                <p>
                    🕰️ <strong>دوره زمین‌شناسی:</strong>
                    ${animal.period}
                </p>

                <p>
                    🍖 <strong>غذا:</strong>
                    ${animal.food}
                </p>

                <p>
                    🌍 <strong>محل زندگی:</strong>
                    ${animal.habitat}
                </p>

                <p>
                    📏 <strong>اندازه:</strong>
                    ${animal.size}
                </p>

                <p>
                    🧍 <strong>مقایسه با انسان:</strong>
                    ${animal.human}
                </p>

                <p>
                    ⏳ <strong>طول عمر:</strong>
                    ${animal.lifespan}
                </p>

                <p>
                    ⚔️ <strong>دشمنان:</strong>
                    ${animal.enemies}
                </p>

                <div style="
                    margin-top:25px;
                    padding:20px;
                    border-radius:20px;
                    background:#1e293b;
                    border:1px solid #334155;
                ">
                    <h3>💡 نکته جالب</h3>
                    <p>${animal.fact}</p>
                </div>
            `;

            const returnPeriod =
                selectedPeriod || animal.period;

            backLink.href =
                "animals.html/animals.html?period=" +
                encodeURIComponent(returnPeriod);

        });
    </script>

</body>

</html>
