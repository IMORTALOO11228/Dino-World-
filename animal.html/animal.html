<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="اطلاعات کامل جانوران ماقبل تاریخ در موزه تعاملی DinoWorld"
    >

    <title>DinoWorld | اطلاعات جانور ماقبل تاریخ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="hero">
        <h1 id="animal-name">🦖 در حال بارگذاری...</h1>

        <p>
            موزه تعاملی دنیای ماقبل تاریخ
        </p>
    </header>


    <main class="periods">

        <section id="animal-details" class="about">

            <p>
                در حال بارگذاری اطلاعات جانور...
            </p>

        </section>


        <div style="text-align: center; margin-top: 30px;">

            <a
                href="animals.html/animals.html"
                class="period-card"
            >
                ← بازگشت به فهرست جانوران
            </a>

        </div>

    </main>


    <footer>
        🟢 DinoWorld | طراحی شده توسط آریا عابدینی 💚
    </footer>


    <script src="script.js/script.js"></script>


    <script>

        const params = new URLSearchParams(
            window.location.search
        );

        const selectedName = params.get("name");


        const animal = window.dinoWorldAnimals?.find(
            item => item.name === selectedName
        );


        const nameElement =
            document.getElementById("animal-name");

        const detailsElement =
            document.getElementById("animal-details");


        if (animal) {

            nameElement.textContent =
                animal.icon + " " + animal.name;


            detailsElement.innerHTML = `

                <img
                    src="${animal.image}"
                    alt="تصویر ${animal.name}"
                    style="
                        display: block;
                        width: 100%;
                        max-width: 650px;
                        height: auto;
                        margin: 0 auto 30px;
                        border-radius: 20px;
                        border: 1px solid #334155;
                    "
                >

                <h2>
                    ${animal.name}
                </h2>

                <p>
                    🕰️ <strong>دوره زمین‌شناسی:</strong>
                    ${animal.period}
                </p>

                <p>
                    🍖 <strong>غذا:</strong>
                    ${animal.food}
                </p>

                <p>
                    🌍 <strong>محل زندگی:</strong>
                    ${animal.habitat}
                </p>

                <p>
                    📏 <strong>اندازه:</strong>
                    ${animal.size}
                </p>

                <p>
                    🧍 <strong>مقایسه با انسان:</strong>
                    ${animal.human}
                </p>

                <p>
                    ⏳ <strong>طول عمر:</strong>
                    ${animal.lifespan}
                </p>

                <p>
                    ⚔️ <strong>دشمنان:</strong>
                    ${animal.enemies}
                </p>


                <div
                    style="
                        margin-top: 30px;
                        padding: 20px;
                        border-radius: 20px;
                        background: #1e293b;
                        border: 1px solid #334155;
                    "
                >

                    <h3>
                        💡 نکته جالب
                    </h3>

                    <p>
                        ${animal.fact}
                    </p>

                </div>

            `;

        } else {

            nameElement.textContent =
                "❌ جانور پیدا نشد";


            detailsElement.innerHTML = `

                <h2>
                    اطلاعاتی پیدا نشد
                </h2>

                <p>
                    اطلاعات جانور موردنظر در پایگاه داده
                    موزه وجود ندارد.
                </p>

                <p>
                    لطفاً از فهرست جانوران یک مورد را انتخاب کنید.
                </p>

            `;

        }

    </script>

</body>

</html>
